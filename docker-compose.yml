name: zidni

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zidni
      POSTGRES_PASSWORD: zidni
      POSTGRES_DB: zidni
    ports:
      # 5433 on the host to avoid clashing with a locally installed PostgreSQL.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zidni -d zidni']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
