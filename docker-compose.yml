name: zidni

# Local / evaluation stack:  docker compose up --build
#   API + Swagger : http://localhost:${API_PORT:-3000}/api/docs
#   MCP (HTTP)    : http://localhost:${MCP_PORT:-3001}/mcp
# Override any ${VAR} via a root .env file (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zidni
      POSTGRES_PASSWORD: zidni
      POSTGRES_DB: zidni
    ports:
      # 5433 on the host to avoid clashing with a locally installed PostgreSQL.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zidni -d zidni']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: zidni/api:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://zidni:zidni@postgres:5432/zidni?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me-0123456789abcdef}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SWAGGER_ENABLED: 'true'
      TRUST_PROXY: 'false'
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ALLOW_PRODUCTION: 'true'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@zidni.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@zidni.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User@123456}
      SEED_CATALOG_AGENT_KEY: ${SEED_CATALOG_AGENT_KEY:-zk_catalog1_dev-catalog-agent-secret-change-me}
      SEED_READONLY_AGENT_KEY: ${SEED_READONLY_AGENT_KEY:-zk_readonl1_dev-readonly-agent-secret-change-me}
    ports:
      - '${API_PORT:-3000}:3000'

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    image: zidni/mcp-server:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:3000/api/v1
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3001
    ports:
      - '${MCP_PORT:-3001}:3001'

  # Full automated test suite in a container (no local Node.js needed):
  #   docker compose --profile test run --rm tests
  tests:
    profiles: ['test']
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://zidni:zidni@postgres:5432/zidni_test?schema=public

volumes:
  pgdata:
